; SolarHelm — PlatformIO configuration for the ESP32-S3 firmware target.
;
; Desktop workflows (unit tests, simulator, coverage) intentionally do NOT
; use PlatformIO: they are plain C++17 driven by the Makefile (`make test`,
; `make sim`, `make coverage`) so they run anywhere with g++ — no package
; registry required. PlatformIO is only needed to build/flash the firmware.
;
;   pio run -e esp32s3          build the firmware stub
;   pio run -e esp32s3 -t upload
;
; The portable core in lib/ is identical for both worlds; PlatformIO picks
; it up via lib_dir, the Makefile via -Ilib/*/src.

[platformio]
src_dir = firmware
lib_dir = lib
; Hardware protocol drivers (drivers/victron, ...) are PlatformIO
; libraries too; the LDF picks them up when firmware includes them.
lib_extra_dirs = drivers
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
; simcore is desktop-only (std::vector/std::string heavy); the firmware must
; never link it.
lib_ignore = simcore
monitor_speed = 115200
